<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="assets/circular.png">
  <title>DropSpot</title>
  <style>
    :root {
      /* Palette inspired by the warm yellow-to-soft blue ambient light */
      --bg-gradient: linear-gradient(135deg, #a7ccff 0%, #dbe7ff 42%, #fff3cf 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.9);
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      
      /* Vibrant Cyan / Teal Accent from glowing box highlights */
      --primary: #06b6d4;
      --primary-dark: #0891b2;
      --primary-light: #ecfeff;
      --primary-gradient: linear-gradient(135deg, #06b6d4 0%, #2563eb 100%);
      --primary-glow: rgba(6, 182, 212, 0.35);

      --danger: #ef4444;
      --danger-light: #fef2f2;
      --success: #10b981;
      --success-light: #ecfdf5;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 16px 40px -10px rgba(30, 58, 138, 0.18);
      --shadow-glow: 0 0 20px var(--primary-glow);
      --radius: 18px;
      --radius-sm: 10px;
      --radius-full: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    .app {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: flex;
      flex-direction: column;
      max-height: 90dvh;
      overflow-y: auto;
    }

    /* ─── AUTH ─── */
    .auth-header { padding: 32px 26px 0; }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: var(--shadow-glow);
    }

    .brand-name {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.4px;
      background: linear-gradient(135deg, #0f172a 0%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-toggle {
      display: flex;
      background: rgba(226, 232, 240, 0.6);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 22px;
    }

    .auth-toggle button {
      flex: 1;
      border: none;
      background: transparent;
      border-radius: 8px;
      padding: 9px;
      font-size: .88rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s ease;
    }

    .auth-toggle button.active {
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .auth-body { padding: 0 26px 28px; }
    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: .78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      border: 1.5px solid var(--line);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: .95rem;
      transition: all .2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
      background: #ffffff;
    }

    input::placeholder { color: #94a3b8; }

    /* ─── BUTTONS ─── */
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      font-size: .95rem;
      cursor: pointer;
      font-weight: 600;
      transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn:active { transform: scale(.97); }
    .btn[disabled] { opacity: .55; cursor: not-allowed; transform: none !important; }

    .btn-primary {
      background: var(--primary-gradient);
      color: white;
      width: 100%;
      padding: 13px;
      font-size: .97rem;
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    .btn-primary:hover:not([disabled]) {
      opacity: 0.95;
      box-shadow: 0 8px 25px var(--primary-glow);
    }

    .btn-google {
      width: 100%;
      background: #ffffff;
      color: #334155;
      border: 1.5px solid var(--line);
      padding: 12px;
      font-size: .95rem;
      box-shadow: var(--shadow-sm);
    }

    .btn-google:hover:not([disabled]) {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .google-icon { flex-shrink: 0; }

    .btn-ghost {
      background: transparent;
      border: 1.5px solid var(--line);
      color: var(--muted);
    }

    .btn-ghost:hover:not([disabled]) { background: rgba(241, 245, 249, 0.8); color: var(--text); }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover:not([disabled]) { background: #dc2626; }

    .btn-soft {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1.5px solid rgba(6, 182, 212, 0.3);
      font-weight: 700;
    }

    .btn-soft:hover:not([disabled]) { background: #cffaff; }

    .btn-icon {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.7);
      border: 1.5px solid var(--line);
      color: var(--muted);
      font-size: 1.1rem;
    }

    .btn-icon:hover { background: #ffffff; color: var(--text); }

    .hidden { display: none !important; }

    /* ─── AUTH DIVIDER ─── */
    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      margin: 18px 0;
    }

    .divider-text::before, .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--line);
    }

    .divider-text span {
      padding: 0 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* ─── MAIN HEADER ─── */
    .main-header {
      padding: 24px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .greeting {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.3px;
    }

    .greeting-sub {
      font-size: .84rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ─── TABS ─── */
    .tab-bar {
      display: flex;
      gap: 0;
      margin: 18px 24px 0;
      border-bottom: 2px solid var(--line);
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 14px;
      font-size: .92rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      position: relative;
      transition: color .2s ease;
    }

    .tab-btn::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--primary-gradient);
      border-radius: 3px 3px 0 0;
      transform: scaleX(0);
      transition: transform .2s ease;
    }

    .tab-btn.active { color: var(--primary-dark); }
    .tab-btn.active::after { transform: scaleX(1); }

    /* ─── PANELS ─── */
    .panel { padding: 20px 24px 28px; }

    /* ─── UPLOAD ZONE ─── */
    .drop-zone {
      border: 2px dashed rgba(6, 182, 212, 0.4);
      background: rgba(236, 254, 255, 0.5);
      border-radius: var(--radius);
      padding: 28px 18px;
      text-align: center;
      cursor: pointer;
      transition: all .2s ease;
      display: block;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--primary);
      background: rgba(207, 250, 254, 0.7);
      box-shadow: var(--shadow-glow);
    }

    .drop-icon {
      font-size: 2.2rem;
      margin-bottom: 10px;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(6, 182, 212, 0.3));
    }

    .drop-title {
      font-weight: 800;
      color: var(--text);
      font-size: 1.02rem;
      margin-bottom: 4px;
    }

    .drop-sub {
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .file-input-hidden { display: none; }

    /* ─── SELECTED FILES ─── */
    .selected-wrap { margin-top: 16px; }

    .selected-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .section-label {
      font-size: .8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
    }

    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-sm);
    }

    .file-thumb-placeholder {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .72rem;
      color: var(--primary-dark);
      font-weight: 800;
      flex-shrink: 0;
      text-transform: uppercase;
      overflow: hidden;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .file-thumb-preview {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--line);
    }

    .file-meta { flex: 1; min-width: 0; }

    .file-name {
      font-size: .88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .file-size {
      font-size: .75rem;
      color: var(--muted);
    }

    .remove-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      font-size: 1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .remove-btn:hover { background: var(--danger-light); color: var(--danger); }

    .upload-footer {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ─── STATUS BAR ─── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .84rem;
      color: var(--muted);
      min-height: 22px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .status-dot.green { background: var(--success); }
    .status-dot.red { background: var(--danger); }
    .status-dot.blue { background: var(--primary); }

    /* ─── ENHANCED UPLOAD PROGRESS ─── */
    .progress-box {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .82rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .progress-detail {
      font-size: .8rem;
      color: var(--muted);
      font-weight: 500;
    }

    .progress-pct {
      color: var(--primary-dark);
      font-weight: 800;
    }

    .progress-track {
      height: 8px;
      background: #e2e8f0;
      border-radius: var(--radius-full);
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #06b6d4 0%, #3b82f6 50%, #10b981 100%);
      background-size: 200% 100%;
      border-radius: var(--radius-full);
      transition: width .15s ease-out;
      width: 0%;
      animation: gradientMove 2s linear infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ─── GALLERY ─── */
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .count-badge {
      font-size: .76rem;
      font-weight: 800;
      background: var(--primary-light);
      color: var(--primary-dark);
      border-radius: var(--radius-full);
      padding: 3px 10px;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .image-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 52dvh;
      overflow-y: auto;
      padding-right: 2px;
    }

    .image-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
      transition: transform .18s, background .18s, border-color .18s, opacity .18s;
    }

    .image-card.is-pinned { border-color: #34d399; background: #f0fdf4; }
    .image-card.swiping-left { background: #fff1f1; border-color: #fca5a5; }
    .image-card.swiping-right { background: var(--success-light); border-color: #86efac; }

    .image-card.anim-delete { animation: slideOutLeft .26s ease forwards; }
    .image-card.anim-pin { animation: bounceIn .32s ease; }

    @keyframes slideOutLeft { to { transform: translateX(-120%); opacity: 0; } }
    @keyframes bounceIn {
      0% { transform: translateX(20px); }
      50% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    .img-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--line);
      flex-shrink: 0;
      background: var(--card-bg);
      cursor: pointer;
    }

    .img-meta { flex: 1; min-width: 0; cursor: pointer; }

    .img-name {
      font-size: .92rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
      margin-bottom: 3px;
    }

    .img-info {
      font-size: .76rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pin-tag {
      font-size: .7rem;
      font-weight: 800;
      background: var(--success-light);
      color: #047857;
      border: 1px solid #a7f3d0;
      border-radius: var(--radius-full);
      padding: 2px 8px;
      flex-shrink: 0;
    }

    .dl-btn {
      flex-shrink: 0;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: 9px;
      padding: 8px 14px;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--primary-glow);
      transition: all .18s ease;
    }

    .dl-btn:hover { opacity: 0.95; }
    .dl-btn:active { transform: scale(.95); }
    .dl-btn[disabled] { opacity: .55; cursor: not-allowed; transform: none; }

    /* ─── SWIPE HINTS ─── */
    .swipe-hint {
      display: flex;
      justify-content: space-between;
      font-size: .73rem;
      color: var(--muted);
      margin-bottom: 10px;
      padding: 0 4px;
      opacity: .85;
      font-weight: 600;
    }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-icon {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));
    }

    .empty-title {
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .empty-sub {
      font-size: .86rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ─── SETTINGS MODAL ─── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 1200;
      padding: 12px;
    }

    @media (min-height: 600px) { .overlay { align-items: center; } }

    .modal-sheet {
      width: 100%;
      max-width: 440px;
      max-height: 88dvh;
      overflow-y: auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      padding: 22px;
      animation: sheetIn .22s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes sheetIn {
      from { transform: translateY(16px) scale(.97); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .settings-section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
      background: #f8fafc;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .settings-row:last-child { border-bottom: none; }

    .settings-row-label {
      font-size: .9rem;
      font-weight: 700;
    }

    .settings-row-sub {
      font-size: .78rem;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.4;
    }

    .toggle-switch {
      position: relative;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
    }

    .toggle-switch input { display: none; }

    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-full);
      background: #cbd5e1;
      transition: background .2s;
      cursor: pointer;
    }

    .toggle-track::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: white;
      top: 3px;
      left: 3px;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
      transition: transform .2s;
    }

    .toggle-switch input:checked + .toggle-track { background: var(--primary); }
    .toggle-switch input:checked + .toggle-track::before { transform: translateX(20px); }

    .settings-btn-row { padding: 12px 14px; background: white; }

    /* ─── POPUP ─── */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1400;
      padding: 16px;
    }

    .popup-card {
      width: 100%;
      max-width: 380px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(15,23,42,.3);
      padding: 22px;
      animation: sheetIn .2s cubic-bezier(.34,1.56,.64,1);
    }

    /* ─── VIEWER ─── */
    .viewer {
      position: fixed;
      inset: 0;
      background: rgba(3, 8, 22, 0.94);
      backdrop-filter: blur(10px);
      z-index: 1300;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer-inner {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px;
    }

    .viewer-img {
      max-width: 100%;
      max-height: 72dvh;
      border-radius: var(--radius);
      object-fit: contain;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .viewer-caption {
      color: rgba(255,255,255,.8);
      font-size: .88rem;
      text-align: center;
      font-weight: 500;
    }

    .viewer-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(30,41,59,.6);
      color: white;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .18s;
    }

    .viewer-nav:hover { background: var(--primary); }
    .viewer-nav.left { left: max(12px, env(safe-area-inset-left)); }
    .viewer-nav.right { right: max(12px, env(safe-area-inset-right)); }

    .viewer-close {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(30,41,59,.6);
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: background .18s;
    }

    .viewer-close:hover { background: rgba(239,68,68,.8); }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      left: 50%;
      top: max(16px, env(safe-area-inset-top));
      transform: translate(-50%, -60px);
      opacity: 0;
      pointer-events: none;
      z-index: 1500;
      border-radius: var(--radius-full);
      padding: 10px 20px;
      background: #0f172a;
      color: white;
      font-size: .88rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
      transition: transform .24s cubic-bezier(.34,1.56,.64,1), opacity .24s;
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast .toast-icon { font-size: 1rem; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast.success { background: #065f46; }
    .toast.error { background: #991b1b; }
    .toast.info { background: #1e40af; }

    @media (max-width: 440px) {
      .app { padding: 0; }
      .container { border-radius: 0; max-height: 100dvh; min-height: 100dvh; border: none; }
      .screen { max-height: 100dvh; }
    }
  </style>
</head>
<body>

            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
  /* ── GLOBAL CONFIG & INSTANCES ── */
  let firebaseConfig = {};
  let CLOUDINARY_CLOUD_NAME = "";
  let CLOUDINARY_UPLOAD_PRESET = "";
  let auth, db, googleProvider;

  /* ── ELEMENTS ── */
  const authScreen = document.getElementById("authScreen");
  const mainScreen = document.getElementById("mainScreen");
  const nameFieldWrap = document.getElementById("nameFieldWrap");
  const nameInput = document.getElementById("nameInput");
  const emailInput = document.getElementById("emailInput");
  const passwordInput = document.getElementById("passwordInput");
  const loginModeBtn = document.getElementById("loginModeBtn");
  const signupModeBtn = document.getElementById("signupModeBtn");
  const authSubmitBtn = document.getElementById("authSubmitBtn");
  const googleAuthBtn = document.getElementById("googleAuthBtn");
  const googleBtnText = document.getElementById("googleBtnText");
  const authStatus = document.getElementById("authStatus");

  const welcomeText = document.getElementById("welcomeText");
  const welcomeSub = document.getElementById("welcomeSub");
  const settingsBtn = document.getElementById("settingsBtn");
  const tabUploadBtn = document.getElementById("tabUploadBtn");
  const tabDownloadBtn = document.getElementById("tabDownloadBtn");
  const uploadPanel = document.getElementById("uploadPanel");
  const downloadPanel = document.getElementById("downloadPanel");

  const fileInput = document.getElementById("fileInput");
  const dropZone = document.getElementById("dropZone");
  const selectedWrap = document.getElementById("selectedWrap");
  const selectedList = document.getElementById("selectedList");
  const selectedLabel = document.getElementById("selectedLabel");
  const clearSelectedBtn = document.getElementById("clearSelectedBtn");
  const uploadBtn = document.getElementById("uploadBtn");
  const uploadStatus = document.getElementById("uploadStatus");
  const progressWrap = document.getElementById("progressWrap");
  const progressFill = document.getElementById("progressFill");
  const progressDetailText = document.getElementById("progressDetailText");
  const progressPctText = document.getElementById("progressPctText");

  const uploadedList = document.getElementById("uploadedList");
  const downloadStatus = document.getElementById("downloadStatus");
  const countBadge = document.getElementById("countBadge");
  const swipeHint = document.getElementById("swipeHint");

  const settingsModal = document.getElementById("settingsModal");
  const settingsCloseBtn = document.getElementById("settingsCloseBtn");
  const settingsStatus = document.getElementById("settingsStatus");
  const changeNameBtn = document.getElementById("changeNameBtn");
  const sendResetBtn = document.getElementById("sendResetBtn");
  const autoDeleteToggle = document.getElementById("autoDeleteToggle");
  const settingsEmailText = document.getElementById("settingsEmailText");
  const settingsLogoutBtn = document.getElementById("settingsLogoutBtn");

  const changeNameModal = document.getElementById("changeNameModal");
  const changeNameCloseBtn = document.getElementById("changeNameCloseBtn");
  const newNameInput = document.getElementById("newNameInput");
  const nameChangePasswordInput = document.getElementById("nameChangePasswordInput");
  const confirmNameChangeBtn = document.getElementById("confirmNameChangeBtn");

  const viewerModal = document.getElementById("viewerModal");
  const viewerMediaWrap = document.getElementById("viewerMediaWrap");
  const viewerCaption = document.getElementById("viewerCaption");
  const viewerPrevBtn = document.getElementById("viewerPrevBtn");
  const viewerNextBtn = document.getElementById("viewerNextBtn");
  const viewerCloseBtn = document.getElementById("viewerCloseBtn");

  const toast = document.getElementById("toast");
  const toastIcon = document.getElementById("toastIcon");
  const toastText = document.getElementById("toastText");

  /* ── STATE ── */
  let isSignupMode = false;
  let selectedFiles = [];
  let currentUser = null;
  let uploadsRefListener = null;
  let currentUploads = [];
  let autoDeleteAfterDownload = false;
  let viewerIndex = 0;
  let suppressPreviewClick = false;
  let toastTimer = null;

  /* ── ASYNC INITIALIZATION ── */
  async function initApp() {
    try {
      const res = await fetch("keys.json");
      if (!res.ok) throw new Error("Could not load keys.json");
      const keys = await res.json();

      firebaseConfig = keys.firebaseConfig;
      CLOUDINARY_CLOUD_NAME = keys.cloudinary.cloudName;
      CLOUDINARY_UPLOAD_PRESET = keys.cloudinary.uploadPreset;

      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.database();
      googleProvider = new firebase.auth.GoogleAuthProvider();

      auth.onAuthStateChanged(handleAuthStateChange);
    } catch (err) {
      console.error("Initialization error:", err);
      showToast("Failed to load API keys", "error");
    }
  }

  /* ── HELPERS ── */
  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  function showToast(message, type = "info") {
    const icons = { success: "✓", error: "✕", info: "ℹ" };
    toastIcon.textContent = icons[type] || "ℹ";
    toastText.textContent = message;
    toast.className = "toast show " + type;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = "toast"; }, 2600);
  }

  function setStatus(el, message, dot = "") {
    el.innerHTML = dot
      ? `<span class="status-dot ${dot}"></span>${escapeHtml(message)}`
      : escapeHtml(message);
  }

  function setAuthMode(signup) {
    isSignupMode = signup;
    nameFieldWrap.classList.toggle("hidden", !signup);
    authSubmitBtn.textContent = signup ? "Create account" : "Log in";
    googleBtnText.textContent = signup ? "Sign up with Google" : "Sign in with Google";
    authStatus.textContent = "";
    loginModeBtn.classList.toggle("active", !signup);
    signupModeBtn.classList.toggle("active", signup);
  }

  function setScreen(loggedIn) {
    authScreen.classList.toggle("hidden", loggedIn);
    mainScreen.classList.toggle("hidden", !loggedIn);
  }

  function setTab(tab) {
    const isUpload = tab === "upload";
    uploadPanel.classList.toggle("hidden", !isUpload);
    downloadPanel.classList.toggle("hidden", isUpload);
    tabUploadBtn.classList.toggle("active", isUpload);
    tabDownloadBtn.classList.toggle("active", !isUpload);
    if (!isUpload && currentUser) loadUploads(currentUser.uid);
    else cleanupUploadsListener();
  }

  function formatBytes(bytes) {
    if (bytes == null || isNaN(bytes)) return "0 B";
    if (bytes < 1024) return bytes + " B";
    const kb = bytes / 1024;
    if (kb < 1024) return kb.toFixed(1) + " KB";
    const mb = kb / 1024;
    if (mb < 1024) return mb.toFixed(1) + " MB";
    return (mb / 1024).toFixed(2) + " GB";
  }

  function formatTime(ts) {
    return new Date(ts || Date.now()).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function safeFileName(name) {
    return (name || "file").replace(/[^\w.\-]+/g, "_");
  }

  function getFileTypeCategory(filename = "", mimeType = "") {
    const ext = filename.split('.').pop().toLowerCase();
    if (mimeType.startsWith('image/') || ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp', 'ico'].includes(ext)) {
      return { type: 'image', icon: '🖼️', ext: ext.toUpperCase() };
    }
    if (mimeType.startsWith('video/') || ['mp4', 'webm', 'mkv', 'mov', 'avi'].includes(ext)) {
      return { type: 'video', icon: '🎬', ext: ext.toUpperCase() };
    }
    if (mimeType.startsWith('audio/') || ['mp3', 'wav', 'ogg', 'aac', 'flac', 'm4a'].includes(ext)) {
      return { type: 'audio', icon: '🎵', ext: ext.toUpperCase() };
    }
    if (ext === 'pdf' || mimeType === 'application/pdf') {
      return { type: 'pdf', icon: '📄', ext: 'PDF' };
    }
    if (['py', 'js', 'html', 'css', 'json', 'ts', 'jsx', 'tsx', 'c', 'cpp', 'java', 'php', 'rb', 'go', 'rs', 'sh', 'md', 'txt'].includes(ext)) {
      return { type: 'code', icon: '💻', ext: ext.toUpperCase() };
    }
    return { type: 'other', icon: '📦', ext: ext.toUpperCase() || 'FILE' };
  }

  function cloudinaryAttachmentUrl(url, filename) {
    try {
      const u = new URL(url);
      if (!u.hostname.includes("cloudinary.com")) return url;
      const parts = u.pathname.split("/upload/");
      if (parts.length < 2) return url;
      return u.origin + parts[0] + "/upload/fl_attachment:" + encodeURIComponent(filename) + "/" + parts[1];
    } catch { return url; }
  }

  function cleanupUploadsListener() {
    if (uploadsRefListener) { uploadsRefListener.off(); uploadsRefListener = null; }
  }

  function uploadsComparator(a, b) {
    const ap = a.pinned ? 1 : 0, bp = b.pinned ? 1 : 0;
    if (bp !== ap) return bp - ap;
    if (ap && bp) return (b.pinnedAt || 0) - (a.pinnedAt || 0);
    return (b.uploadedAt || 0) - (a.uploadedAt || 0);
  }

  /* ── SELECTED FILES ── */
  function renderSelectedFiles() {
    selectedList.innerHTML = "";
    const count = selectedFiles.length;
    selectedWrap.classList.toggle("hidden", count === 0);
    uploadBtn.disabled = count === 0;
    selectedLabel.textContent = count === 1 ? "1 file selected" : count + " files selected";

    selectedFiles.forEach((file, idx) => {
      const li = document.createElement("li");
      li.className = "file-row";

      const cat = getFileTypeCategory(file.name, file.type);
      if (cat.type === 'image') {
        const img = document.createElement("img");
        img.className = "file-thumb-preview";
        img.alt = "";
        const reader = new FileReader();
        reader.onload = e => { img.src = e.target.result; };
        reader.readAsDataURL(file);
        li.appendChild(img);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "file-thumb-placeholder";
        placeholder.textContent = cat.ext.slice(0, 4);
        li.appendChild(placeholder);
      }

      const meta = document.createElement("div");
      meta.className = "file-meta";
      meta.innerHTML = `<div class="file-name">${escapeHtml(file.name)}</div><div class="file-size">${formatBytes(file.size)}</div>`;

      const rmBtn = document.createElement("button");
      rmBtn.className = "remove-btn";
      rmBtn.title = "Remove";
      rmBtn.textContent = "✕";
      rmBtn.addEventListener("click", () => {
        selectedFiles.splice(idx, 1);
        renderSelectedFiles();
      });

      li.appendChild(meta);
      li.appendChild(rmBtn);
      selectedList.appendChild(li);
    });
  }

  /* ── UPLOAD WITH PROGRESS TRACKING ── */
  function uploadToCloudinaryWithProgress(file, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      const endpoint = "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload";
      const fd = new FormData();
      fd.append("file", file);
      fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
      fd.append("folder", "user_uploads");

      xhr.upload.addEventListener("progress", (e) => {
        if (e.lengthComputable && onProgress) {
          onProgress(e.loaded, e.total);
        }
      });

      xhr.addEventListener("load", () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            resolve(JSON.parse(xhr.responseText));
          } catch (err) {
            reject(err);
          }
        } else {
          reject(new Error("Upload failed: " + xhr.responseText));
        }
      });

      xhr.addEventListener("error", () => reject(new Error("Network upload error")));
      xhr.addEventListener("abort", () => reject(new Error("Upload aborted")));

      xhr.open("POST", endpoint);
      xhr.send(fd);
    });
  }

  /* ── VIEWER ── */
  function openViewer(index) {
    if (!currentUploads.length) return;
    viewerIndex = Math.max(0, Math.min(index, currentUploads.length - 1));
    viewerModal.classList.remove("hidden");
    updateViewer();
  }

  function closeViewer() {
    viewerModal.classList.add("hidden");
    viewerMediaWrap.innerHTML = "";
    viewerCaption.textContent = "";
  }

  function updateViewer() {
    if (!currentUploads.length) { closeViewer(); return; }
    viewerIndex = Math.max(0, Math.min(viewerIndex, currentUploads.length - 1));
    const item = currentUploads[viewerIndex];
    const cat = getFileTypeCategory(item.originalName || "", item.mimeType || "");
    
    viewerMediaWrap.innerHTML = "";

    if (cat.type === 'image') {
      const img = document.createElement("img");
      img.className = "viewer-img";
      img.src = item.url;
      img.alt = item.originalName || "Preview";
      viewerMediaWrap.appendChild(img);
    } else if (cat.type === 'video') {
      const video = document.createElement("video");
      video.className = "viewer-img";
      video.src = item.url;
      video.controls = true;
      video.autoplay = true;
      viewerMediaWrap.appendChild(video);
    } else if (cat.type === 'audio') {
      const audio = document.createElement("audio");
      audio.src = item.url;
      audio.controls = true;
      audio.autoplay = true;
      audio.style.width = "100%";
      audio.style.maxWidth = "400px";
      viewerMediaWrap.appendChild(audio);
    } else if (cat.type === 'pdf' || cat.type === 'code') {
      const iframe = document.createElement("iframe");
      iframe.src = item.url;
      iframe.style.width = "100%";
      iframe.style.height = "60dvh";
      iframe.style.borderRadius = "var(--radius)";
      iframe.style.border = "none";
      iframe.style.background = "#fff";
      viewerMediaWrap.appendChild(iframe);
    } else {
      const div = document.createElement("div");
      div.style.padding = "40px 20px";
      div.style.textAlign = "center";
      div.style.color = "#fff";
      div.innerHTML = `<div style="font-size:3.5rem; margin-bottom:12px;">${cat.icon}</div>
                       <a href="${item.url}" target="_blank" rel="noopener noreferrer" style="color:#38bdf8; text-decoration:underline; font-weight:600; font-size:1rem;">Open or Preview File ↗</a>`;
      viewerMediaWrap.appendChild(div);
    }

    viewerCaption.textContent = (item.originalName || "file") + " · " + (viewerIndex + 1) + " of " + currentUploads.length;
  }

  function showPrevImage() {
    if (!currentUploads.length) return;
    viewerIndex = (viewerIndex - 1 + currentUploads.length) % currentUploads.length;
    updateViewer();
  }

  function showNextImage() {
    if (!currentUploads.length) return;
    viewerIndex = (viewerIndex + 1) % currentUploads.length;
    updateViewer();
  }

  /* ── DELETE / PIN ── */
  async function deleteUploadItem(id, silent = false) {
    if (!currentUser) return false;
    try {
      await db.ref("users/" + currentUser.uid + "/uploads/" + id).remove();
      if (!silent) showToast("File deleted", "error");
      return true;
    } catch (err) {
      if (!silent) showToast("Delete failed", "error");
      return false;
    }
  }

  async function pinUploadItem(id) {
    if (!currentUser) return false;
    try {
      await db.ref("users/" + currentUser.uid + "/uploads/" + id).update({ pinned: true, pinnedAt: Date.now() });
      showToast("Pinned to top", "success");
      return true;
    } catch {
      showToast("Pin failed", "error");
      return false;
    }
  }

  /* ── SWIPE ── */
  function makeSwipeable(li, item) {
    let startX = 0, startY = 0, dx = 0, tracking = false, horizontal = false;

    function resetVisual() {
      li.style.transform = "";
      li.classList.remove("swiping-left", "swiping-right");
    }

    li.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (e.target.closest("button")) return;
      startX = e.clientX; startY = e.clientY; dx = 0;
      tracking = true; horizontal = false;
      if (li.setPointerCapture) li.setPointerCapture(e.pointerId);
    });

    li.addEventListener("pointermove", e => {
      if (!tracking) return;
      const mx = e.clientX - startX, my = e.clientY - startY;
      if (!horizontal) {
        if (Math.abs(my) > 9 && Math.abs(my) > Math.abs(mx)) { tracking = false; resetVisual(); return; }
        if (Math.abs(mx) > 6) horizontal = true;
      }
      if (!horizontal) return;
      dx = Math.max(-140, Math.min(140, mx));
      li.style.transform = "translateX(" + dx + "px)";
      li.classList.toggle("swiping-left", dx < 0);
      li.classList.toggle("swiping-right", dx > 0);
      if (Math.abs(dx) > 8) suppressPreviewClick = true;
      e.preventDefault();
    });

    function endSwipe() {
      if (!tracking && !horizontal) { resetVisual(); suppressPreviewClick = false; return; }
      tracking = false;
      const threshold = 88;
      if (dx <= -threshold) {
        li.classList.add("anim-delete");
        li.classList.remove("swiping-left", "swiping-right");
        setTimeout(() => deleteUploadItem(item.id), 220);
      } else if (dx >= threshold) {
        li.classList.add("anim-pin");
        li.classList.remove("swiping-left", "swiping-right");
        resetVisual();
        setTimeout(() => { pinUploadItem(item.id); li.classList.remove("anim-pin"); }, 210);
      } else {
        resetVisual();
      }
      dx = 0;
      setTimeout(() => { suppressPreviewClick = false; }, 130);
    }

    li.addEventListener("pointerup", endSwipe);
    li.addEventListener("pointercancel", () => { tracking = false; dx = 0; resetVisual(); suppressPreviewClick = false; });
  }

  /* ── RENDER GALLERY ── */
  function renderUploads() {
    uploadedList.innerHTML = "";
    const count = currentUploads.length;

    if (!count) {
      countBadge.classList.add("hidden");
      swipeHint.classList.add("hidden");
      uploadedList.innerHTML = `
        <div class="empty-state">
          <span class="empty-icon">📭</span>
          <div class="empty-title">No files yet</div>
          <div class="empty-sub">Upload your files and they will appear here.</div>
        </div>`;
      if (!viewerModal.classList.contains("hidden")) closeViewer();
      setStatus(downloadStatus, "");
      return;
    }

    countBadge.textContent = count + (count === 1 ? " file" : " files");
    countBadge.classList.remove("hidden");
    swipeHint.classList.remove("hidden");
    setStatus(downloadStatus, "");

    currentUploads.forEach((item, index) => {
      const li = document.createElement("li");
      li.className = "image-card";
      if (item.pinned) li.classList.add("is-pinned");

      const cat = getFileTypeCategory(item.originalName || "", item.mimeType || "");
      let thumbEl;

      if (cat.type === 'image' && item.url) {
        thumbEl = document.createElement("img");
        thumbEl.className = "img-thumb";
        thumbEl.src = item.url;
        thumbEl.alt = "thumbnail";
      } else {
        thumbEl = document.createElement("div");
        thumbEl.className = "file-thumb-placeholder";
        thumbEl.style.width = "52px";
        thumbEl.style.height = "52px";
        thumbEl.style.fontSize = ".75rem";
        thumbEl.style.cursor = "pointer";
        thumbEl.textContent = cat.ext.slice(0, 4);
      }
      thumbEl.addEventListener("click", () => { if (!suppressPreviewClick) openViewer(index); });

      const meta = document.createElement("div");
      meta.className = "img-meta";
      meta.addEventListener("click", () => { if (!suppressPreviewClick) openViewer(index); });

      const nameLine = document.createElement("div");
      nameLine.className = "img-name";
      nameLine.textContent = item.originalName || "file";

      const infoLine = document.createElement("div");
      infoLine.className = "img-info";
      const infoParts = [];
      if (item.uploadedAt) infoParts.push(formatTime(item.uploadedAt));
      if (item.bytes) infoParts.push(formatBytes(item.bytes));
      infoLine.textContent = infoParts.join(" · ");

      meta.appendChild(nameLine);
      meta.appendChild(infoLine);

      li.appendChild(thumbEl);
      li.appendChild(meta);

      if (item.pinned) {
        const tag = document.createElement("span");
        tag.className = "pin-tag";
        tag.textContent = "Pinned";
        li.appendChild(tag);
      }

      const dlBtn = document.createElement("button");
      dlBtn.className = "dl-btn";
      dlBtn.textContent = "⬇ Save";
      dlBtn.addEventListener("click", e => { e.stopPropagation(); downloadFileDirect(item, dlBtn); });
      li.appendChild(dlBtn);

      uploadedList.appendChild(li);
      makeSwipeable(li, item);
    });
  }

  function loadUploads(uid) {
    cleanupUploadsListener();
    uploadedList.innerHTML = "";
    setStatus(downloadStatus, "Loading…", "blue");

    const ref = db.ref("users/" + uid + "/uploads");
    uploadsRefListener = ref;

    ref.on("value", snap => {
      const data = snap.val() || {};
      currentUploads = Object.keys(data).map(k => ({ id: k, ...data[k] })).sort(uploadsComparator);
      renderUploads();
      if (!viewerModal.classList.contains("hidden")) updateViewer();
    }, err => {
      setStatus(downloadStatus, "Failed to load: " + (err.message || "Unknown error"), "red");
    });
  }

  /* ── DOWNLOAD ── */
  async function downloadFileDirect(item, buttonEl) {
    const orig = buttonEl.textContent;
    buttonEl.disabled = true;
    buttonEl.textContent = "…";

    const filename = safeFileName(item.originalName || "file");
    let triggered = false;

    try {
      const resp = await fetch(item.url, { mode: "cors" });
      if (!resp.ok) throw new Error("Could not fetch.");
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      triggered = true;
      showToast("Downloaded!", "success");
    } catch {
      const a = document.createElement("a");
      a.href = cloudinaryAttachmentUrl(item.url, filename);
      a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      triggered = true;
      showToast("Download started", "info");
    } finally {
      buttonEl.disabled = false;
      buttonEl.textContent = orig;
    }

    if (triggered && autoDeleteAfterDownload && currentUser) {
      const deleted = await deleteUploadItem(item.id, true);
      if (deleted) showToast("Downloaded and removed", "success");
    }
  }

  /* ── SETTINGS ── */
  function openSettings() {
    if (!currentUser) return;
    settingsStatus.textContent = "";
    settingsEmailText.textContent = currentUser.email || "–";
    settingsModal.classList.remove("hidden");
  }

  function closeSettings() { settingsModal.classList.add("hidden"); }
  function openChangeNamePopup() {
    newNameInput.value = currentUser.displayName || "";
    nameChangePasswordInput.value = "";
    changeNameModal.classList.remove("hidden");
  }
  function closeChangeNamePopup() { changeNameModal.classList.add("hidden"); }

  async function loadUserSettings(uid) {
    try {
      const snap = await db.ref("users/" + uid + "/settings").get();
      const s = snap.val() || {};
      autoDeleteAfterDownload = !!s.autoDeleteAfterDownload;
    } catch { autoDeleteAfterDownload = false; }
    autoDeleteToggle.checked = autoDeleteAfterDownload;
  }

  async function reauthenticateCurrentUser(password) {
    const user = auth.currentUser;
    if (!user || !user.email) throw new Error("No authenticated user.");
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, password);
    await user.reauthenticateWithCredential(cred);
  }

  /* ── EVENTS ── */
  loginModeBtn.addEventListener("click", () => setAuthMode(false));
  signupModeBtn.addEventListener("click", () => setAuthMode(true));

  googleAuthBtn.addEventListener("click", async () => {
    googleAuthBtn.disabled = true;
    authSubmitBtn.disabled = true;
    setStatus(authStatus, "Connecting to Google…", "blue");

    try {
      const result = await auth.signInWithPopup(googleProvider);
      const user = result.user;

      const snap = await db.ref("users/" + user.uid + "/profile").get();
      if (!snap.exists()) {
        await db.ref("users/" + user.uid).update({
          profile: {
            name: user.displayName || "User",
            email: user.email,
            createdAt: Date.now()
          },
          settings: { autoDeleteAfterDownload: false }
        });
      }
      showToast("Signed in with Google! 🎉", "success");
    } catch (err) {
      let msg = "Google authentication failed.";
      if (err.code === "auth/popup-closed-by-user") {
        msg = "Sign-in window closed.";
      } else if (err.code === "auth/popup-blocked") {
        msg = "Popup blocked by browser.";
      } else if (err.message) {
        msg = err.message;
      }
      setStatus(authStatus, msg, "red");
    } finally {
      googleAuthBtn.disabled = false;
      authSubmitBtn.disabled = false;
    }
  });

  authSubmitBtn.addEventListener("click", async () => {
    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) { setStatus(authStatus, "Please enter your email and password.", "red"); return; }
    if (isSignupMode && !name) { setStatus(authStatus, "Please enter your name.", "red"); return; }

    authSubmitBtn.disabled = true;
    googleAuthBtn.disabled = true;
    authSubmitBtn.textContent = "Please wait…";
    authStatus.textContent = "";

    try {
      if (isSignupMode) {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await cred.user.updateProfile({ displayName: name });
        await db.ref("users/" + cred.user.uid).update({
          profile: { name, email, createdAt: Date.now() },
          settings: { autoDeleteAfterDownload: false }
        });
        showToast("Welcome to DropSpot! 🎉", "success");
      } else {
        await auth.signInWithEmailAndPassword(email, password);
        showToast("Welcome back!", "success");
      }
    } catch (err) {
      const msg = err.code === "auth/user-not-found" ? "No account with that email."
        : err.code === "auth/wrong-password" ? "Incorrect password."
        : err.code === "auth/email-already-in-use" ? "That email is already in use."
        : err.message || "Authentication failed.";
      setStatus(authStatus, msg, "red");
    } finally {
      authSubmitBtn.disabled = false;
      googleAuthBtn.disabled = false;
      authSubmitBtn.textContent = isSignupMode ? "Create account" : "Log in";
    }
  });

  tabUploadBtn.addEventListener("click", () => setTab("upload"));
  tabDownloadBtn.addEventListener("click", () => setTab("download"));
  settingsBtn.addEventListener("click", openSettings);
  settingsCloseBtn.addEventListener("click", closeSettings);
  settingsModal.addEventListener("click", e => { if (e.target === settingsModal) closeSettings(); });
  changeNameBtn.addEventListener("click", openChangeNamePopup);
  changeNameCloseBtn.addEventListener("click", closeChangeNamePopup);
  changeNameModal.addEventListener("click", e => { if (e.target === changeNameModal) closeChangeNamePopup(); });

  confirmNameChangeBtn.addEventListener("click", async () => {
    if (!currentUser) return;
    const newName = newNameInput.value.trim();
    const pwd = nameChangePasswordInput.value.trim();
    if (!newName || !pwd) { showToast("Please fill in both fields.", "error"); return; }

    confirmNameChangeBtn.disabled = true;
    confirmNameChangeBtn.textContent = "Saving…";
    try {
      await reauthenticateCurrentUser(pwd);
      await auth.currentUser.updateProfile({ displayName: newName });
      await db.ref("users/" + currentUser.uid + "/profile/name").set(newName);
      welcomeText.textContent = "Hi, " + newName + " 👋";
      closeChangeNamePopup();
      showToast("Name updated!", "success");
    } catch (err) {
      showToast(err.message || "Could not change name.", "error");
    } finally {
      confirmNameChangeBtn.disabled = false;
      confirmNameChangeBtn.textContent = "Save name";
    }
  });

  sendResetBtn.addEventListener("click", async () => {
    if (!currentUser?.email) return;
    sendResetBtn.disabled = true;
    try {
      await auth.sendPasswordResetEmail(currentUser.email);
      showToast("Reset link sent to " + currentUser.email, "success");
    } catch (err) {
      showToast(err.message || "Could not send reset link.", "error");
    } finally { sendResetBtn.disabled = false; }
  });

  autoDeleteToggle.addEventListener("change", async e => {
    const newVal = !!e.target.checked;
    const oldVal = autoDeleteAfterDownload;
    autoDeleteAfterDownload = newVal;
    if (!currentUser) return;
    try {
      await db.ref("users/" + currentUser.uid + "/settings").update({ autoDeleteAfterDownload: newVal });
      showToast(newVal ? "Auto-delete enabled" : "Auto-delete disabled", "info");
    } catch {
      autoDeleteAfterDownload = oldVal;
      autoDeleteToggle.checked = oldVal;
      showToast("Could not save setting.", "error");
    }
  });

  settingsLogoutBtn.addEventListener("click", async () => {
    try { await auth.signOut(); closeSettings(); closeChangeNamePopup(); }
    catch (err) { showToast(err.message || "Logout failed.", "error"); }
  });

  /* ── FILE PICKING ── */
  fileInput.addEventListener("change", e => {
    selectedFiles = Array.from(e.target.files || []);
    renderSelectedFiles();
  });

  clearSelectedBtn.addEventListener("click", () => {
    selectedFiles = [];
    fileInput.value = "";
    renderSelectedFiles();
    uploadStatus.textContent = "";
  });

  /* ── DRAG & DROP ── */
  ["dragenter","dragover"].forEach(ev => {
    dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
  });
  ["dragleave","drop"].forEach(ev => {
    dropZone.addEventListener(ev, e => {
      e.preventDefault();
      dropZone.classList.remove("drag-over");
      if (ev === "drop" && e.dataTransfer?.files?.length) {
        selectedFiles = Array.from(e.dataTransfer.files);
        renderSelectedFiles();
      }
    });
  });

  /* ── UPLOAD WITH DETAILED SIZE & PERCENTAGE PROGRESS ── */
  uploadBtn.addEventListener("click", async () => {
    if (!currentUser || !selectedFiles.length) return;

    uploadBtn.disabled = true;
    progressWrap.classList.remove("hidden");
    
    const totalFiles = selectedFiles.length;
    const totalBytesAllFiles = selectedFiles.reduce((sum, f) => sum + (f.size || 0), 0);
    let uploadedBytesCompleted = 0;
    let okCount = 0;

    progressFill.style.width = "0%";
    progressPctText.textContent = "0%";
    progressDetailText.textContent = `0 B of ${formatBytes(totalBytesAllFiles)}`;
    setStatus(uploadStatus, `Uploading 0 of ${totalFiles}…`, "blue");

    for (let i = 0; i < totalFiles; i++) {
      const file = selectedFiles[i];
      let currentFileUploaded = 0;

      try {
        const cloud = await uploadToCloudinaryWithProgress(file, (loaded, total) => {
          currentFileUploaded = loaded;
          const currentTotalLoaded = uploadedBytesCompleted + currentFileUploaded;
          const pct = Math.min(100, Math.round((currentTotalLoaded / (totalBytesAllFiles || 1)) * 100));

          progressFill.style.width = pct + "%";
          progressPctText.textContent = pct + "%";
          progressDetailText.textContent = `${formatBytes(currentTotalLoaded)} of ${formatBytes(totalBytesAllFiles)}`;
          setStatus(uploadStatus, `Uploading file ${i + 1} of ${totalFiles}…`, "blue");
        });

        await db.ref("users/" + currentUser.uid + "/uploads").push({
          url: cloud.secure_url,
          publicId: cloud.public_id,
          originalName: file.name,
          mimeType: file.type,
          resourceType: cloud.resource_type || "auto",
          bytes: file.size,
          uploadedAt: Date.now(),
          pinned: false
        });

        okCount++;
      } catch (err) {
        console.error("Upload failed for file:", file.name, err);
      }

      uploadedBytesCompleted += file.size;
    }

    // Wrap up
    progressFill.style.width = "100%";
    progressPctText.textContent = "100%";
    progressDetailText.textContent = `${formatBytes(totalBytesAllFiles)} of ${formatBytes(totalBytesAllFiles)}`;

    uploadBtn.disabled = false;
    selectedFiles = [];
    fileInput.value = "";
    renderSelectedFiles();

    if (okCount === totalFiles) {
      setStatus(uploadStatus, `All ${totalFiles} files uploaded successfully!`, "green");
      showToast("All files uploaded ✓", "success");
    } else {
      setStatus(uploadStatus, `${okCount} of ${totalFiles} uploaded.`, okCount > 0 ? "green" : "red");
      showToast(`${okCount}/${totalFiles} uploaded`, okCount === totalFiles ? "success" : "error");
    }

    setTimeout(() => {
      progressWrap.classList.add("hidden");
      setTab("download");
    }, 1000);
  });

  /* ── VIEWER EVENTS ── */
  viewerPrevBtn.addEventListener("click", showPrevImage);
  viewerNextBtn.addEventListener("click", showNextImage);
  viewerCloseBtn.addEventListener("click", closeViewer);
  viewerModal.addEventListener("click", e => { if (e.target === viewerModal) closeViewer(); });

  document.addEventListener("keydown", e => {
    if (!viewerModal.classList.contains("hidden")) {
      if (e.key === "ArrowLeft") showPrevImage();
      if (e.key === "ArrowRight") showNextImage();
      if (e.key === "Escape") closeViewer();
    } else {
      if (!changeNameModal.classList.contains("hidden") && e.key === "Escape") closeChangeNamePopup();
      else if (!settingsModal.classList.contains("hidden") && e.key === "Escape") closeSettings();
    }
  });

  /* ── AUTH OBSERVER HANDLER ── */
  async function handleAuthStateChange(user) {
    currentUser = user || null;

    if (user) {
      setScreen(true);
      setTab("upload");

      let displayName = user.displayName || "";
      if (!displayName) {
        try {
          const snap = await db.ref("users/" + user.uid + "/profile/name").get();
          displayName = snap.val() || "there";
        } catch { displayName = "there"; }
      }

      welcomeText.textContent = "Hi, " + displayName + " 👋";
      welcomeSub.textContent = user.email;
      settingsEmailText.textContent = user.email || "–";
      await loadUserSettings(user.uid);
    } else {
      cleanupUploadsListener();
      currentUploads = [];
      uploadedList.innerHTML = "";
      selectedFiles = [];
      fileInput.value = "";
      renderSelectedFiles();
      autoDeleteAfterDownload = false;
      autoDeleteToggle.checked = false;
      closeChangeNamePopup();
      closeSettings();
      closeViewer();
      setScreen(false);
      setAuthMode(false);
    }
  }

  /* ── START APP ── */
  initApp();
  setAuthMode(false);
</script>
</body>
</html>
